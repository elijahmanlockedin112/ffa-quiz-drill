<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FFA Quiz Drill</title>
<style>
:root{--bg:#0B2463;--card:#FFFFFF;--ink:#0F1A2E;--ink2:#4B5770;--line:#D3DAE6;--gold:#FFC940;--bad:#B23F17;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--card:#121D33;--ink:#E8EDF6;--ink2:#A0ACC3;--line:#27365384;--bad:#F2906A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px 16px;border-top:6px solid var(--gold)}
form{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.lock{width:46px;height:46px;border-radius:12px;background:var(--gold);display:grid;place-items:center;margin-bottom:14px}
h1{font:800 24px/1.1 "Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
p{margin:0 0 18px;color:var(--ink2);font-size:15px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink)}
input[type=password]:focus{outline:3px solid var(--gold);outline-offset:1px}
.rem{display:flex;gap:10px;align-items:center;margin:14px 0 18px;font-size:14px;color:var(--ink2)}
.rem input{width:20px;height:20px;accent-color:#1B4A94}
button{width:100%;border:0;border-radius:12px;background:#1B4A94;color:#fff;font:700 17px/1 system-ui,sans-serif;padding:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:12px}
</style>
</head>

<script>
(async () => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const $ = id => document.getElementById(id);
  const store = {
    get(){ try { return localStorage.getItem('ffa-k') || sessionStorage.getItem('ffa-k'); } catch(e){ return null; } },
    clear(){ try { localStorage.removeItem('ffa-k'); sessionStorage.removeItem('ffa-k'); } catch(e){} }
  };
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    $('err').textContent = 'This browser is too old to open the app. Update it and try again.';
    $('go').disabled = true; return;
  }
  async function open(raw){
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const zipped = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(P.iv)}, key, b64d(P.ct)));
    const plain = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    return new TextDecoder().decode(plain);
  }
  async function derive(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64d(P.salt), iterations: P.iter, hash: 'SHA-256'}, base, 256));
  }
  function launch(html, keyB64){
    try { sessionStorage.setItem('ffa-k', keyB64); } catch(e){}
    const inject = '<script>window.__FFA_K=' + JSON.stringify(keyB64) + ';<\/script>';
    html = html.replace(/<head>/i, '<head>' + inject);
    document.open(); document.write(html); document.close();
  }
  const saved = store.get();
  if (saved) {
    try { return launch(await open(b64d(saved)), saved); } catch(e){ store.clear(); }
  }
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('go').textContent = 'Unlocking…'; $('err').textContent = '';
    try {
      const raw = await derive(pw.trim());
      const html = await open(raw);
      const k = b64e(raw);
      if ($('rem').checked) { try { localStorage.setItem('ffa-k', k); } catch(e){} }
      launch(html, k);
    } catch(e){
      $('err').textContent = 'That password didn’t work. Check it and try again.';
      $('go').disabled = false; $('go').textContent = 'Unlock'; $('pw').select();
    }
  });
})();
</script>
